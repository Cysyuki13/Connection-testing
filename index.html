<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P2P GitHub Pages Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        #gameCanvas {
            background-color: #111;
            border: 2px solid #fff;
            display: block;
            margin: 20px auto;
        }
        .hidden { display: none; }
        input, button {
            padding: 10px;
            font-size: 16px;
            margin: 5px;
            border-radius: 5px;
            border: none;
        }
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
        }
        button:hover { background-color: #45a049; }
        input { background: #333; color: white; }
    </style>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <h1>P2P WebRTC Game</h1>

    <div id="setup-screen">
        <h3>Step 1: Host or Join</h3>
        <button id="host-btn">Create Game (Host)</button>
        <p id="my-id-display">Generating your ID...</p>
        
        <hr style="width: 50%; margin: 20px auto; border-color: #444;">
        
        <h3>Step 2: Join a Game</h3>
        <input type="text" id="peer-id-input" placeholder="Paste Host ID here">
        <button id="join-btn">Join Game</button>
    </div>

    <div id="game-screen" class="hidden">
        <h3 id="connection-status">Connecting...</h3>
        <canvas id="gameCanvas" width="600" height="400"></canvas>
        <p>Use <b>Arrow Keys</b> or <b>W/A/S/D</b> to move your square.</p>
    </div>

    <script>
        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const hostBtn = document.getElementById('host-btn');
        const joinBtn = document.getElementById('join-btn');
        const peerIdInput = document.getElementById('peer-id-input');
        const myIdDisplay = document.getElementById('my-id-display');
        const connectionStatus = document.getElementById('connection-status');
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let peer;
        let conn;
        let isHost = false;

        // Game State
        const myPos = { x: 100, y: 100, size: 30, color: '#ff5722', speed: 4 };
        const peerPos = { x: 400, y: 200, size: 30, color: '#2196F3' };
        const keys = {};

        // Initialize PeerJS
        function initPeer() {
            peer = new Peer(); // Uses PeerJS free public cloud server for signaling

            peer.on('open', (id) => {
                myIdDisplay.innerText = `Your Host ID: ${id}`;
            });

            // If someone connects to us (We are Host)
            peer.on('connection', (connection) => {
                conn = connection;
                isHost = true;
                setupConnectionHandlers();
                startGameUI();
            });
        }

        initPeer();

        // Host Button Click
        hostBtn.addEventListener('click', () => {
            if (!peer.id) {
                alert("Peer ID not ready yet. Please wait a second.");
            } else {
                myIdDisplay.innerText = `Waiting for connection on ID: ${peer.id}`;
            }
        });

        // Join Button Click (We are Client)
        joinBtn.addEventListener('click', () => {
            const remoteId = peerIdInput.value.trim();
            if (!remoteId) {
                alert("Please enter a valid Host ID.");
                return;
            }
            isHost = false;
            conn = peer.connect(remoteId);
            setupConnectionHandlers();
            startGameUI();
        });

        function setupConnectionHandlers() {
            conn.on('open', () => {
                connectionStatus.innerText = "Connected! Game active.";
            });

            conn.on('data', (data) => {
                // Receive position data from the other player
                peerPos.x = data.x;
                peerPos.y = data.y;
            });

            conn.on('close', () => {
                alert("The other player disconnected.");
                location.reload();
            });
        }

        function startGameUI() {
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            requestAnimationFrame(gameLoop);
        }

        // Handle Keyboard Inputs
        window.addEventListener('keydown', (e) => { keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });

        function update() {
            // Movement logic
            if (keys['ArrowUp'] || keys['w'] || keys['W']) myPos.y -= myPos.speed;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) myPos.y += myPos.speed;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) myPos.x -= myPos.speed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) myPos.x += myPos.speed;

            // Boundaries
            myPos.x = Math.max(0, Math.min(canvas.width - myPos.size, myPos.x));
            myPos.y = Math.max(0, Math.min(canvas.height - myPos.size, myPos.y));

            // Send position to peer if connected
            if (conn && conn.open) {
                conn.send({ x: myPos.x, y: myPos.y });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw My Square
            ctx.fillStyle = myPos.color;
            ctx.fillRect(myPos.x, myPos.y, myPos.size, myPos.size);

            // Draw Peer's Square
            ctx.fillStyle = peerPos.color;
            ctx.fillRect(peerPos.x, peerPos.y, peerPos.size, peerPos.size);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
