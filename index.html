<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>4-Digit P2P Game</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding: 10px;
            touch-action: manipulation;
        }
        #gameCanvas {
            background-color: #111;
            border: 2px solid #fff;
            display: block;
            margin: 10px auto;
            max-width: 100%;
            height: auto;
        }
        .hidden { display: none !important; }
        input, button {
            padding: 12px;
            font-size: 18px;
            margin: 6px;
            border-radius: 8px;
            border: none;
            box-sizing: border-box;
        }
        input[type="text"] {
            background: #333;
            color: white;
            text-align: center;
            letter-spacing: 4px;
            font-weight: bold;
            width: 160px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
        }
        button:active { background-color: #388E3C; }
        
        #mobile-controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 10px;
        }
        .control-row {
            display: flex;
            gap: 20px;
        }
        .ctrl-btn {
            width: 65px;
            height: 55px;
            font-size: 20px;
            background-color: #333;
            border: 1px solid #555;
            color: white;
            border-radius: 10px;
            user-select: none;
            -webkit-user-select: none;
        }
        .ctrl-btn:active, .ctrl-btn.active {
            background-color: #ff5722;
        }
    </style>
    <!-- Use jsDelivr CDN to avoid tracking prevention issues -->
    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <h2>4-Digit Code P2P Game</h2>

    <!-- Setup / Connection Screen -->
    <div id="setup-screen">
        <p><b>Host:</b> Enter or generate a 4-digit code</p>
        <input type="text" id="host-code-input" maxlength="4" inputmode="numeric" placeholder="1234"><br>
        <button id="host-btn">Host Game</button>
        
        <hr style="width: 80%; margin: 20px auto; border-color: #444;">
        
        <p><b>Join:</b> Enter friend's 4-digit code</p>
        <input type="text" id="join-code-input" maxlength="4" inputmode="numeric" placeholder="1234"><br>
        <button id="join-btn" style="background-color: #2196F3;">Join Game</button>
        
        <p id="error-msg" style="color: #ff5252; margin-top: 10px; font-size: 14px;"></p>
    </div>

    <!-- Game Screen -->
    <div id="game-screen" class="hidden">
        <h4 id="connection-status" style="margin: 5px 0; color: #ffcc00;">Connecting...</h4>
        <canvas id="gameCanvas" width="400" height="300"></canvas>
        
        <!-- On-Screen Touch D-Pad -->
        <div id="mobile-controls">
            <div><button class="ctrl-btn" id="btn-up">⬆️</button></div>
            <div class="control-row">
                <button class="ctrl-btn" id="btn-left">⬅️</button>
                <button class="ctrl-btn" id="btn-down">⬇️</button>
                <button class="ctrl-btn" id="btn-right">➡️</button>
            </div>
        </div>
    </div>

    <script>
        const setupScreen = document.getElementById('setup-screen');
        const gameScreen = document.getElementById('game-screen');
        const hostBtn = document.getElementById('host-btn');
        const joinBtn = document.getElementById('join-btn');
        const hostCodeInput = document.getElementById('host-code-input');
        const joinCodeInput = document.getElementById('join-code-input');
        const connectionStatus = document.getElementById('connection-status');
        const errorMsg = document.getElementById('error-msg');
        
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        let peer;
        let conn;
        
        const APP_PREFIX = "p2p_square_game_";

        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:global.stun.twilio.com:3478' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            }
        };

        hostCodeInput.value = Math.floor(1000 + Math.random() * 9000);

        const myPos = { x: 50, y: 50, size: 25, color: '#ff5722', speed: 3.5 };
        const peerPos = { x: 300, y: 200, size: 25, color: '#2196F3' };
        const keys = {};

        hostBtn.addEventListener('click', () => {
            const code = hostCodeInput.value.trim();
            if (code.length !== 4) {
                errorMsg.innerText = "Code must be exactly 4 digits.";
                return;
            }
            errorMsg.style.color = "#ffcc00";
            errorMsg.innerText = "Hosting... registering code...";

            if (peer) peer.destroy();

            peer = new Peer(APP_PREFIX + code, peerConfig);

            peer.on('open', (id) => {
                errorMsg.style.color = "#4CAF50";
                errorMsg.innerText = `Ready! Give code "${code}" to your friend.`;
            });

            peer.on('error', (err) => {
                errorMsg.style.color = "#ff5252";
                if (err.type === 'unavailable-id') {
                    errorMsg.innerText = "That 4-digit code is already taken. Try another.";
                } else {
                    errorMsg.innerText = `PeerJS Error: ${err.type}`;
                }
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnectionHandlers();
            });
        });

        joinBtn.addEventListener('click', () => {
            const code = joinCodeInput.value.trim();
            if (code.length !== 4) {
                errorMsg.innerText = "Please enter a valid 4-digit code.";
                return;
            }
            errorMsg.style.color = "#ffcc00";
            errorMsg.innerText = "Connecting to host...";

            if (peer) peer.destroy();

            peer = new Peer(peerConfig);

            peer.on('open', () => {
                conn = peer.connect(APP_PREFIX + code);
                setupConnectionHandlers();
            });

            peer.on('error', (err) => {
                errorMsg.style.color = "#ff5252";
                errorMsg.innerText = `Connection failed: Check the code.`;
            });
        });

        function setupConnectionHandlers() {
            setupScreen.classList.add('hidden');
            gameScreen.classList.remove('hidden');
            requestAnimationFrame(gameLoop);

            conn.on('open', () => {
                connectionStatus.style.color = "#4CAF50";
                connectionStatus.innerText = "Connected Peer-to-Peer!";
            });

            if (conn.peerConnection) {
                conn.peerConnection.oniceconnectionstatechange = () => {
                    const state = conn.peerConnection.iceConnectionState;
                    if (state === 'connected' || state === 'completed') {
                        connectionStatus.style.color = "#4CAF50";
                        connectionStatus.innerText = "Connected Peer-to-Peer!";
                    } else if (state === 'checking') {
                        connectionStatus.style.color = "#ffcc00";
                        connectionStatus.innerText = "Negotiating network path...";
                    } else if (state === 'failed' || state === 'disconnected') {
                        connectionStatus.style.color = "#ff5252";
                        connectionStatus.innerText = `Firewall blocked direct P2P (${state}).`;
                    }
                };
            }

            conn.on('data', (data) => {
                peerPos.x = data.x;
                peerPos.y = data.y;
            });

            conn.on('close', () => {
                alert("Connection lost with the other player.");
                location.reload();
            });
        }

        window.addEventListener('keydown', (e) => { keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });

        const bindTouchButton = (id, keyName) => {
            const btn = document.getElementById(id);
            const activate = (e) => { e.preventDefault(); keys[keyName] = true; btn.classList.add('active'); };
            const deactivate = (e) => { e.preventDefault(); keys[keyName] = false; btn.classList.remove('active'); };

            btn.addEventListener('touchstart', activate, { passive: false });
            btn.addEventListener('touchend', deactivate, { passive: false });
            btn.addEventListener('mousedown', activate);
            btn.addEventListener('mouseup', deactivate);
            btn.addEventListener('mouseleave', deactivate);
        };

        bindTouchButton('btn-up', 'ArrowUp');
        bindTouchButton('btn-down', 'ArrowDown');
        bindTouchButton('btn-left', 'ArrowLeft');
        bindTouchButton('btn-right', 'ArrowRight');

        function update() {
            if (keys['ArrowUp'] || keys['w'] || keys['W']) myPos.y -= myPos.speed;
            if (keys['ArrowDown'] || keys['s'] || keys['S']) myPos.y += myPos.speed;
            if (keys['ArrowLeft'] || keys['a'] || keys['A']) myPos.x -= myPos.speed;
            if (keys['ArrowRight'] || keys['d'] || keys['D']) myPos.x += myPos.speed;

            myPos.x = Math.max(0, Math.min(canvas.width - myPos.size, myPos.x));
            myPos.y = Math.max(0, Math.min(canvas.height - myPos.size, myPos.y));

            if (conn && conn.open) {
                conn.send({ x: myPos.x, y: myPos.y });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = myPos.color;
            ctx.fillRect(myPos.x, myPos.y, myPos.size, myPos.size);
            ctx.fillStyle = peerPos.color;
            ctx.fillRect(peerPos.x, peerPos.y, peerPos.size, peerPos.size);
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
